<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FridgeUp! – Download</title>
    <meta name="description" content="Download FridgeUp! for iPhone or Android.">
    <!--
        One QR code for both platforms. The phone that opens this page is sent
        straight to its own store: iPhone/iPad -> App Store, Android -> Google
        Play. Anything else (a computer) sees the two buttons below.
        No tracking, no cookies, no external resources: same rules as the
        privacy policy next door.
    -->
    <script>
        (function () {
            var APP_STORE = "https://apps.apple.com/app/id6779924343";
            var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.csigillo.fridgeup";
            var ua = navigator.userAgent || "";
            // iPadOS asks for the desktop site and calls itself "Macintosh";
            // a touch screen gives it away.
            var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/i.test(ua);
            if (isIOS) { window.location.replace(APP_STORE); }
            else if (isAndroid) { window.location.replace(PLAY_STORE); }
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 420px;
            width: 100%;
            padding: 48px 24px;
            text-align: center;
        }
        .icon {
            width: 112px;
            height: 112px;
            border-radius: 26px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 32px;
        }
        .button {
            display: block;
            padding: 16px 20px;
            margin-bottom: 14px;
            border-radius: 14px;
            background: #1d1d1f;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
        }
        .button:hover { background: #3a3a3c; }
        .button span {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.75;
        }
        .footer {
            margin-top: 28px;
            font-size: 0.85rem;
        }
        .footer a { color: #6e6e73; }
    </style>
</head>
<body>
    <main class="container">
        <img class="icon" src="icon.png" alt="FridgeUp! app icon">
        <h1>FridgeUp!</h1>
        <a class="button" href="https://apps.apple.com/app/id6779924343">
            iPhone · iPad
            <span>App Store</span>
        </a>
        <a class="button" href="https://play.google.com/store/apps/details?id=com.csigillo.fridgeup">
            Android
            <span>Google Play</span>
        </a>
        <p class="footer"><a href="../">Privacy Policy</a></p>
    </main>
</body>
</html>
